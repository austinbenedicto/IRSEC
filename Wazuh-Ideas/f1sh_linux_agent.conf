<agent_config os="Linux">
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <!-- Identity and privilege files: scheduled scans -->
    <directories check_all="yes">/etc/passwd,/etc/group,/etc/shadow,/etc/gshadow,/etc/sudoers</directories>
    <!-- SSH, sudo, persistence: real-time directory monitoring -->
    <directories check_all="yes" realtime="yes">/etc/ssh,/etc/sudoers.d,/etc/cron.d,/etc/cron.daily,/etc/cron.hourly,/etc/cron.weekly,/etc/cron.monthly,/etc/systemd/system</directories>
    <directories check_all="yes" realtime="yes">/usr/local/bin,/usr/local/sbin</directories>
    <!-- Optional harmless test directory: create before deploying if used -->
    <!-- <directories check_all="yes" realtime="yes">/opt/f1sh-fim-test</directories> -->
  </syscheck>
</agent_config>
