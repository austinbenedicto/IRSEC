---
# Deployment only. Does not execute tools or change scored services.
- name: Distribute IRSEC Linux tools
  hosts: linux
  gather_facts: false
  become: false
  vars:
    remote_dir: /tmp/irsec-tools
  tasks:
    - name: Make target directory without Python
      ansible.builtin.raw: "mkdir -p {{ (remote_dir ~ "/scripts") | quote }} {{ (remote_dir ~ "/yara/rules") | quote }}"
      changed_when: false
    - name: Copy Linux scripts without target Python
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/scripts_linux/"
        dest: "{{ remote_dir }}/scripts/"
        archive: true
        delete: false
        use_ssh_args: true

- name: Distribute IRSEC Windows tools
  hosts: windows
  gather_facts: false
  vars:
    windows_dir: 'C:\IRSEC-Tools'
  tasks:
    - name: Create toolkit directory
      ansible.windows.win_file:
        path: "{{ windows_dir }}"
        state: directory
    - name: Copy auditing scripts
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../AuditingScripts/"
        dest: "{{ windows_dir }}\Auditing Scripts\"
